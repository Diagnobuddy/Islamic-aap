<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a5c36">
  <title>Islamic PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.3/lib/bundles/adhan.min.js"></script>
</head>
<body>
  <header>
    <h1>🕌 Islamic PWA</h1>
    <nav>
      <button onclick="showTab('namaz')">Namaz</button>
      <button onclick="showTab('quran')">Quran</button>
      <button onclick="showTab('hadith')">Hadith</button>
      <button onclick="showTab('tasbeeh')">Tasbeeh</button>
      <button onclick="showTab('qaza')">Qaza</button>
    </nav>
  </header>

  <main>
    <section id="namaz" class="tab">Loading...</section>
    <section id="quran" class="tab hidden">Loading...</section>
    <section id="hadith" class="tab hidden">Loading...</section>
    <section id="tasbeeh" class="tab hidden">Loading...</section>
    <section id="qaza" class="tab hidden">Loading...</section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/prayer-times.js"></script>
  <script src="js/quran.js"></script>
  <script src="js/hadith.js"></script>
  <script src="js/tasbeeh.js"></script>
  <script src="js/qaza.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
