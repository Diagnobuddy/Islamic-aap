<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0B3D2E">
<title>Faizan — E — Sunnat</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
<div class="header-left">
<div class="logo-circle">☪</div>
<div>
<h1 class="app-title">FAIZAN - E - SUNNAT</h1>
<p class="app-subtitle">Islamic Companion</p>
</div>
</div>
<button class="dark-toggle" onclick="toggleDarkMode()"><span id="dark-icon">🌙</span></button>
</header>

<div class="hadith-top-bar" id="hadith-top-bar">
<span class="hadith-top-icon">📜</span>
<div class="hadith-top-text" id="hadith-top-text">Loading hadith...</div>
</div>

<div class="info-bar">
<div class="info-item" onclick="toggleHijriCalendar()" style="cursor:pointer;">
<span class="info-icon">📅</span>
<span id="hijri-date">Loading...</span>
<span style="font-size:0.7rem;opacity:0.6;">▼</span>
</div>
<div class="info-item">
<span class="info-icon">📍</span>
<span id="city-name">Locating...</span>
</div>
</div>

<div id="hijri-calendar-popup" class="hijri-calendar-popup hidden">
<div class="hijri-calendar-inner">
<div class="hijri-calendar-header">
<button onclick="changeHijriMonth(-1)" class="hijri-nav-btn">‹</button>
<div>
<div id="hijri-month-title" style="font-weight:600;font-size:0.95rem;color:var(--primary);">Rajab 1447</div>
<div id="hijri-month-subtitle" style="font-size:0.72rem;color:var(--text-muted);">December 2025</div>
</div>
<button onclick="changeHijriMonth(1)" class="hijri-nav-btn">›</button>
</div>
<div class="hijri-calendar-weekdays">
<div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>
<div id="hijri-calendar-grid" class="hijri-calendar-grid"></div>
<div class="hijri-calendar-footer">
<button onclick="goToToday()" class="hijri-today-btn">📅 Today</button>
<button onclick="toggleHijriCalendar()" class="hijri-close-btn">Close</button>
</div>
</div>
</div>

<main class="app-main">
<section id="namaz" class="tab active">Loading...</section>
<section id="quran" class="tab">Loading...</section>
<section id="hadith" class="tab">Loading...</section>
<section id="masjid" class="tab">Loading...</section>
<section id="tasbeeh" class="tab">Loading...</section>
<section id="qaza" class="tab">Loading...</section>
</main>

<nav class="bottom-nav">
<button class="nav-btn active" data-tab="namaz" onclick="showTab('namaz')"><span class="nav-icon">🕌</span><span class="nav-label">Namaz</span></button>
<button class="nav-btn" data-tab="quran" onclick="showTab('quran')"><span class="nav-icon">📖</span><span class="nav-label">Quran</span></button>
<button class="nav-btn" data-tab="hadith" onclick="showTab('hadith')"><span class="nav-icon">📜</span><span class="nav-label">Hadith</span></button>
<button class="nav-btn" data-tab="masjid" onclick="showTab('masjid')"><span class="nav-icon">🕌</span><span class="nav-label">Masjid</span></button>
<button class="nav-btn" data-tab="tasbeeh" onclick="showTab('tasbeeh')"><span class="nav-icon">📿</span><span class="nav-label">Tasbeeh</span></button>
<button class="nav-btn" data-tab="qaza" onclick="showTab('qaza')"><span class="nav-icon">🧮</span><span class="nav-label">Qaza</span></button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/adhan.min.js"></script>

<script src="js/app.js"></script>
<script src="js/prayer-times.js"></script>
<script src="js/quran.js"></script>
<script src="js/hadith.js"></script>
<script src="js/masjid.js"></script>
<script src="js/tasbeeh.js"></script>
<script src="js/qaza.js"></script>
</body>
</html>
